name: CI

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main, "release/**"]

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Empty on forked PRs (GitHub withholds secrets), which skips the Sonar scan below.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar needs full history to find new code and blame data

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven   # caches ~/.m2 keyed on the pom.xml files

      # Docker is preinstalled on the runner, so Testcontainers works as-is.
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      # Runs after the tests and reads the JaCoCo report they produced. Project key and
      # organization live in pom.xml properties. The quality gate is evaluated by SonarQube
      # Cloud and reported on the PR as its own check; see docs/adr/0005-sonarqube-quality-gate.md.
      - name: Cache SonarQube Cloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        run: mvn --batch-mode --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: wallet-core/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 7
